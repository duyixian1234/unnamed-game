# Native CI: build + test the workspace (issue #15).
# The wasm/browser build is verified locally via trunk (ADR-0003); CI covers
# the simulation crate's headless integration tests and the app build.

name: ci

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Bevy system deps on Linux: wayland-sys (winit) and alsa-sys (cpal)
      # both need pkg-config libs at build time.
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libasound2-dev
      - name: Build (native)
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace

  web-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: Install browser test dependencies
        working-directory: e2e
        run: pnpm install --frozen-lockfile
      - name: Run Edge end-to-end test
        working-directory: e2e
        run: pnpm test
