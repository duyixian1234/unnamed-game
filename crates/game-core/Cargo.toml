[package]
name = "game-core"
version = "0.1.0"
edition = "2021"

# Simulation-only crate (ADR-0004): state machine, waves, combat, economy,
# enemies, player, weapons, AI, RNG, and the intent layer. No render, window,
# or audio dependencies — integration tests run this crate headlessly.

[dependencies]
# bevy_ecs / bevy_app / bevy_math / bevy_time / bevy_transform are always
# included; only optional subsystems are features. `bevy_state` provides the
# state machine; no render/window/audio subsystem is enabled (ADR-0004).
bevy = { workspace = true, default-features = false, features = [
  "std",
  "bevy_state",
] }
rand = { workspace = true }
rand_chacha = { workspace = true }
web-time = "1"
