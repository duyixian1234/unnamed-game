<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>unnamed-game</title>
    <!-- Copy the Bevy assets/ directory (repo root) into the dist root so
         runtime asset loads resolve to /assets/... in the browser build. -->
    <link data-trunk rel="copy-dir" href="../../assets" />
    <!-- Explicit rust asset so wasm-opt actually runs: trunk's auto-injected
         default keeps it OFF even on --release (trunk 0.21 quirk).
         Requires network on first build; trunk downloads its own binaryen. -->
    <link data-trunk rel="rust" data-wasm-opt="s" data-bin="unnamed-game" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #111;
        overflow: hidden;
      }
      /* Center the fixed-size game canvas in the viewport (letterbox #111).
         Viewports smaller than 1280x720 clip (accepted limitation). */
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        width: 1280px;
        height: 720px;
      }
    </style>
  </head>
  <body>
    <!-- Bevy app mounts its WebGPU canvas here (built by Trunk). -->
    <script>
      // Web audio autoplay-policy workaround (no sound without this):
      // bevy_audio/rodio create the cpal AudioContext at startup, before any
      // user gesture, so the browser starts it "suspended" and cpal's one-shot
      // resume() in Stream::play() has already run by then. Track every
      // context created via the constructor and resume them all on the first
      // pointer/keyboard gesture (the Start button click qualifies).
      (function () {
        var contexts = new Set();
        var RealAudioContext = window.AudioContext;
        function PatchedAudioContext(options) {
          var ctx = new RealAudioContext(options);
          contexts.add(ctx);
          return ctx;
        }
        PatchedAudioContext.prototype = RealAudioContext.prototype;
        window.AudioContext = PatchedAudioContext;
        var resumeAll = function () {
          contexts.forEach(function (ctx) {
            if (ctx.state === "suspended") {
              RealAudioContext.prototype.resume.call(ctx);
            }
          });
        };
        document.addEventListener("pointerdown", resumeAll);
        document.addEventListener("keydown", resumeAll);
      })();
    </script>
  </body>
</html>
