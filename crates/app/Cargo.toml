[package]
name = "unnamed-game"
version = "0.5.0"
edition = "2021"

# The presentation crate (ADR-0004): DefaultPlugins (render/window/audio),
# sprites, UI, camera, and the seed CLI. All simulation logic lives in
# `game-core`; this crate reads core state and attaches visuals to it.

[[bin]]
name = "unnamed-game"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true }
game-core = { path = "../game-core" }
web-time = "1"
# Settings persistence (ADR 0011). 0.9 is the only release whose Bevy bound is
# ^0.17; 0.10/0.11 target Bevy 0.18/0.19. `json` is the storage format — the
# crate emits `compile_error!` if no format feature is enabled.
bevy-persistent = { version = "0.9", features = ["json"] }
# Workspace's first serde dependency: `Settings` must be Serialize +
# DeserializeOwned for `Persistent`. `bevy_persistent` pulls serde in without
# the derive feature, so we have to ask for it ourselves.
serde = { version = "1", features = ["derive"] }
