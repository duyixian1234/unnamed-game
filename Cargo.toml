[workspace]
resolver = "2"
members = ["crates/game-core", "crates/app"]

[workspace.dependencies]
# Bevy 0.17 pinned (see CONTEXT.md -> Decisions, ADR-0001).
# We opt OUT of default features and enable only what each crate needs.
# `app` enables the full 2D sprite set below (removes 3D and keeps the wasm
# bundle small enough to deploy to Cloudflare Pages, <=25 MiB). WebGPU is
# enabled and WebGL2 is left off, per ADR-0001.
bevy = { version = "0.17", default-features = false, features = [
  "std",
  "async_executor",
  "bevy_asset",
  "bevy_audio",
  "bevy_camera",
  "bevy_color",
  "bevy_core_pipeline",
  "bevy_image",
  "bevy_input_focus",
  "bevy_log",
  "bevy_render",
  "bevy_sprite",
  "bevy_sprite_render",
  "bevy_state",
  "bevy_text",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_window",
  "bevy_winit",
  "custom_cursor",
  "default_font",
  "png",
  "reflect_auto_register",
  "vorbis",
  "webgpu",
  "x11",
  "wayland",
] }

# Seeded RNG for deterministic runs (ADR-0005).
rand = "0.9"
rand_chacha = "0.9"

[profile.dev]
# Slightly faster local iteration for the native loop.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
# Optimize the wasm binary size for deployment.
opt-level = "s"
